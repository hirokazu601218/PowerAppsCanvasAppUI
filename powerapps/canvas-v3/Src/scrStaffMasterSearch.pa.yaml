                    =Set(varFetched111,Blank()); Set(varFetchError111,Blank()); Set(varHistoryId111,Blank()); Set(varPayrollCellTitle111,Blank());Set(varPayrollCellText111,Blank()); Set(varHistoryStaff111,StaffSelected.StaffId);
