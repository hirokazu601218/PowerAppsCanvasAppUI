name: Studio edit isolated Dataverse tables
on:
  push:
    branches: [work/studio-edit-isolated-crud]
    paths: [automation/studio-edit-run.json]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  dataverse:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check Work deadline and schema definitions
        run: |
          python - <<'PY'
          import json,time
          from datetime import datetime
          r=json.load(open('automation/studio-edit-run.json'))
          assert 3600-(time.time()-datetime.fromisoformat(r['started_at']).timestamp())>180,'PAUSED_TIME_LIMIT'
          PY
          python -m unittest discover -s tests/automation -p test_studio_edit_schema.py -v
      - uses: azure/login@v2
        with:
          client-id: 1c94f011-c447-4af1-968f-ec564f489395
          tenant-id: a00c92fa-e1db-4aa6-ab28-356c3203353d
          allow-no-subscriptions: true
      - name: Preflight or provision Studio tables
        run: |
          remaining=$(python - <<'PY'
          import json,time
          from datetime import datetime
          r=json.load(open('automation/studio-edit-run.json'))
          print(max(0,int(3600-(time.time()-datetime.fromisoformat(r['started_at']).timestamp()))-90))
          PY
          )
          test "$remaining" -gt 120 || { echo PAUSED_TIME_LIMIT; exit 1; }
          timeout --kill-after=5 "$remaining" python -u scripts/automation/studio_edit_dataverse.py
      - name: Preserve non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-edit-dataverse-${{ github.run_id }}
          path: artifacts/studio-edit
          retention-days: 14
          if-no-files-found: warn
