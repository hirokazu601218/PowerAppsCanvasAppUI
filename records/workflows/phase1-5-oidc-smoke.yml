name: Phase 1.5 OIDC smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-smoke:
    name: Authenticate to isolated test environment
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 10
    env:
      POWER_PLATFORM_TENANT_ID: a00c92fa-e1db-4aa6-ab28-356c3203353d
      POWER_PLATFORM_CLIENT_ID: 1c94f011-c447-4af1-968f-ec564f489395
      POWER_PLATFORM_TEST_ENVIRONMENT_URL: https://orge762dd9e.crm7.dynamics.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Power Platform CLI
        shell: bash
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Authenticate with GitHub OIDC
        shell: bash
        run: |
          pac auth create \
            --name test-oidc \
            --githubFederated \
            --tenant "$POWER_PLATFORM_TENANT_ID" \
            --applicationId "$POWER_PLATFORM_CLIENT_ID" \
            --environment "$POWER_PLATFORM_TEST_ENVIRONMENT_URL"
          echo "OIDC token exchange completed. Dataverse access is validated by the round-trip workflow."
