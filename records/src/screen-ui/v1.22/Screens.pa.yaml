                    Control: Label@2.5.1
                    Properties:
                      Text: ="勤務日の欠勤（確認用）"
                      Height: =44
                      Width: =215
                      Font: ="Segoe UI"
                      Size: =11
                      Color: =UiTheme.Text
                      PaddingLeft: =12
                      PaddingRight: =12
                      PaddingTop: =4
                      PaddingBottom: =4
                      FillPortions: =0
                      LayoutMinWidth: =0
                - ddAttendanceAbsence:
                    Control: Classic/DropDown@2.3.1
                    Properties:
                      Items: =["0","30","60","1"]
                      Default: =Text(UiAbsence)
                      OnChange: =false
                      Height: =44
                      Width: =100
                      AccessibleLabel: ="欠勤時間（分）"
                      Font: ="Segoe UI"
                      Size: =11
                      BorderColor: =UiTheme.Border
                      BorderThickness: =1
                      Color: =UiTheme.Text
                      Fill: =Color.White
                      ChevronBackground: =Color.White
                      ChevronFill: =UiTheme.Primary
                      SelectionFill: =UiTheme.Selected
                      SelectionColor: =UiTheme.Text
                      FillPortions: =0
                      LayoutMinWidth: =0
                - lblAttendanceMinutes:
                    Control: Label@2.5.1
