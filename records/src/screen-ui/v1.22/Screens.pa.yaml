                  Font: ="Segoe UI"
                  Size: =11
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
            - ddHomeDepartment:
                Control: Classic/DropDown@2.3.1
                Properties:
                  Items: =["01秘書課","02総務課","03会計課"]
                  Default: =UiDepartment
                  OnChange: =Set(varUiDepartment,Self.Selected.Value); Set(varUiStaffNo,Blank()); Set(varStaff111,Blank());
