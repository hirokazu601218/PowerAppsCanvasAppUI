              Text: ="画面確認用の仮例 ｜ 日別データと登録操作はアプリ内だけに保持します"
              Height: =44
              Width: =Parent.Width
              Font: ="Segoe UI"
              Size: =11
              Color: =UiTheme.Primary
              PaddingLeft: =24
              PaddingRight: =12
              PaddingTop: =4
              PaddingBottom: =4
              FillPortions: =0
              LayoutMinWidth: =0
        - conAttendanceScroll:
            Control: GroupContainer@1.5.0
            Variant: AutoLayout
            Properties:
              Height: =Parent.Height-168
              Width: =Parent.Width
              LayoutDirection: =LayoutDirection.Vertical
              LayoutAlignItems: =LayoutAlignItems.Stretch
              LayoutGap: =8
              FillPortions: =0
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              PaddingTop: =0
              PaddingBottom: =16
              PaddingLeft: =24
              PaddingRight: =24
              DropShadow: =DropShadow.None
              LayoutOverflowY: =LayoutOverflow.Scroll
            Children:
            - lblAttendanceSummary:
                Control: Label@2.5.1
                Properties:
                  Text: ="勤務日数 " & Text(UiDays) & "日　｜　控除対象の欠勤 " & Text(UiAbsence/60,If(Mod(UiAbsence,60)=0,"0","0.######"))
                    & "時間　｜　" & If(UiRegistered,"登録済み","未登録")
                  Height: =52
                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =13
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  FontWeight: =FontWeight.Semibold
                  Fill: =UiTheme.Band
            - lblAttendanceColumns:
                Control: Label@2.5.1
                Properties:
                  Text: ="勤務日　　　　　　　　日区分　　　　　通常勤務　　　　欠勤記録"
                  Height: =40
                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =11
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  Fill: =UiTheme.Band
            - galAttendanceDays:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Items: =If(!IsBlank(UiSelected.StaffNo) && UiRegistered && Month(UiMonth)<>11,UiDailyRows)
                  Height: =380
                  Width: =Parent.Width
                  TemplateSize: =44
                  TemplatePadding: =0
                  AccessibleLabel: ="勤務時間報告の日別一覧"
                  Selectable: =false
                  FillPortions: =1
                  LayoutMinHeight: =200
                Children:
                - lblAttendanceDay:
                    Control: Label@2.5.1
                    Properties:
                      Text: =Text(ThisItem.WorkDate,"yyyy/mm/dd") & "　　　" & ThisItem.DayType & "　　　" & Text(ThisItem.RegularMinutes)
                        & " 分　　　" & Text(ThisItem.AbsenceMinutes) & " 分"
                      Height: =44
                      Width: =Parent.TemplateWidth
                      Font: ="Segoe UI"
                      Size: =11
                      Color: =UiTheme.Text
                      PaddingLeft: =12
                      PaddingRight: =12
                      PaddingTop: =4
                      PaddingBottom: =4
                      FillPortions: =0
                      LayoutMinWidth: =0
                      Fill: =If(Mod(Day(ThisItem.WorkDate),2)=0,UiTheme.Background,Color.White)
            - lblAttendanceEmpty:
                Control: Label@2.5.1
                Properties:
                  Text: =If(IsBlank(UiSelected.StaffNo),"職員マスタ検索から対象職員を選択してください",!UiRegistered,"この月の勤務は未登録です",Month(UiMonth)=11,"登録済みの勤務0日です","")
