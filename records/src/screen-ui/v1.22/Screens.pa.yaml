                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =11
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
