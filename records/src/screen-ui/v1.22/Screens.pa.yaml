                  Height: =62
                  Width: =Parent.Width-48
                  Font: ="Segoe UI"
                  Size: =14
                  BasePaletteColor: =UiTheme.Primary
                  Appearance: =ButtonAppearance.Primary
                  FillPortions: =0
                  LayoutMinWidth: =0
            - btnHomeMaintenance:
