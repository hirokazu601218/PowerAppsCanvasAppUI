        - conPayGrossHeading:
            Control: GroupContainer@1.5.0
            Variant: AutoLayout
            Properties:
              Height: =48
              Width: =Parent.Width
              LayoutDirection: =LayoutDirection.Horizontal
              LayoutAlignItems: =LayoutAlignItems.Stretch
              LayoutGap: =8
              FillPortions: =0
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              PaddingTop: =0
              PaddingBottom: =0
              PaddingLeft: =0
              PaddingRight: =0
              DropShadow: =DropShadow.None
              Fill: =UiTheme.Band
            Children:
            - conPayGrossHeadingTitle:
                Control: Label@2.5.1
                Properties:
                  Text: ="給与支給総額の内訳"
                  Height: =48
                  Width: =700
                  Font: ="Segoe UI"
                  Size: =13
                  Color: =UiTheme.Header
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =1
                  LayoutMinWidth: =0
                  FontWeight: =FontWeight.Semibold
            - conPayGrossHeadingAmount:
                Control: Label@2.5.1
                Properties:
                  Text: =If(UiReady,If(Mod(UiGross,1)=0,Text(UiGross,"#,##0"),"約 " & Text(UiGross,"#,##0.000000")) & " 円","—")
                  Height: =48
                  Width: =230
                  Font: ="Segoe UI"
                  Size: =14
                  Color: =UiTheme.Primary
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  Align: =Align.Right
                  FontWeight: =FontWeight.Semibold
        - conPayEarnings:
            Control: GroupContainer@1.5.0
            Variant: AutoLayout
            Properties:
              Height: =If(Coalesce(varUiEarningsOpen,true),lblPayGrossEquation.Height+48+lblPaySalaryEquation.Height+lblPayFixed.Height+lblPayAbsence.Height+36+48+lblPayCommuteBasis.Height+56,0)
              Width: =Parent.Width
              LayoutDirection: =LayoutDirection.Vertical
              LayoutAlignItems: =LayoutAlignItems.Stretch
              LayoutGap: =8
              FillPortions: =0
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              PaddingTop: =0
              PaddingBottom: =0
              PaddingLeft: =12
              PaddingRight: =12
              DropShadow: =DropShadow.None
              Visible: =Coalesce(varUiEarningsOpen,true)
              LayoutOverflowY: =LayoutOverflow.Scroll
              Fill: =Color.White
            Children:
            - lblPayGrossEquation:
                Control: Label@2.5.1
                Properties:
                  Text: =If(UiReady,"俸給支給額 " & Text(UiSalary,If(Mod(UiSalary,1)=0,"#,##0","#,##0.000000")) & "円 ＋ 通勤手当 " &
                    Text(UiCommute,"#,##0") & "円 ＝ " & Text(UiGross,If(Mod(UiGross,1)=0,"#,##0","#,##0.000000")) & "円","—")
                  Height: =64
                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =12
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  AutoHeight: =true
                  Fill: =Color.White
            - conPaySalaryHeading:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =48
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  FillPortions: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  DropShadow: =DropShadow.None
                  Fill: =UiTheme.Band
                Children:
                - conPaySalaryHeadingTitle:
                    Control: Label@2.5.1
                    Properties:
                      Text: ="俸給支給額"
                      Height: =48
                      Width: =700
                      Font: ="Segoe UI"
                      Size: =13
                      Color: =UiTheme.Header
                      PaddingLeft: =12
                      PaddingRight: =12
                      PaddingTop: =4
                      PaddingBottom: =4
                      FillPortions: =1
                      LayoutMinWidth: =0
                      FontWeight: =FontWeight.Semibold
                - conPaySalaryHeadingAmount:
                    Control: Label@2.5.1
                    Properties:
                      Text: =If(UiReady,If(Mod(UiSalary,1)=0,Text(UiSalary,"#,##0"),"約 " & Text(UiSalary,"#,##0.000000"))
                        & " 円","—")
                      Height: =48
                      Width: =230
                      Font: ="Segoe UI"
                      Size: =14
                      Color: =UiTheme.Primary
                      PaddingLeft: =12
                      PaddingRight: =12
                      PaddingTop: =4
                      PaddingBottom: =4
                      FillPortions: =0
                      LayoutMinWidth: =0
                      Align: =Align.Right
                      FontWeight: =FontWeight.Semibold
            - lblPaySalaryEquation:
                Control: Label@2.5.1
                Properties:
                  Text: =If(UiReady,"固定額 " & Text(UiFixed,"#,##0") & "円 − 欠勤減額 " & Text(UiReduction,If(Mod(UiReduction,1)=0,"#,##0","#,##0.000000"))
                    & "円 ＝ " & Text(UiSalary,If(Mod(UiSalary,1)=0,"#,##0","#,##0.000000")) & "円","—")
                  Height: =56
                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =11
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  AutoHeight: =true
            - lblPayFixed:
                Control: Label@2.5.1
                Properties:
                  Text: =If(UiReady,"固定額　　　　日額単価 " & Text(UiSelected.DailyRate,"#,##0") & "円　×　勤務日数 " & Text(UiDays) & "日　＝　"
                    & Text(UiFixed,"#,##0") & "円","固定額　—")
                  Height: =64
                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =11
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  AutoHeight: =true
                  Fill: =Color.White
            - lblPayAbsence:
                Control: Label@2.5.1
                Properties:
                  Text: =If(UiReady,"欠勤減額　　　欠勤時間単価 " & Text(UiSelected.AbsenceHourlyRate,"#,##0") & "円/時　×　" & If(Mod(UiAbsence,3)<>0,"約
                    ","") & Text(UiAbsence/60,If(Mod(UiAbsence,60)=0,"0","0.######")) & "時間　＝　" & If(Mod(UiAbsence,3)<>0,"約
                    ","") & Text(UiReduction,If(Mod(UiReduction,1)=0,"#,##0","#,##0.000000")) & "円","欠勤減額　—")
                  Height: =64
                  Width: =Parent.Width
                  Font: ="Segoe UI"
                  Size: =11
                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
