                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  FillPortions: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  DropShadow: =DropShadow.None
                  Fill: =UiTheme.Band
