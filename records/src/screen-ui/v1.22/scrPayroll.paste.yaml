                  Text: =If(UiReady,If(Mod(UiNet,1)=0,Text(UiNet,"#,##0"),"約 " & Text(UiNet,"#,##0.000000")) & " 円","—")
                  Height: =58
                  Width: =Parent.Width
                  Font: ="Segoe UI"
