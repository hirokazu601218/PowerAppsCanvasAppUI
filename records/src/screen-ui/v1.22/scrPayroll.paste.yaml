- conscrPayrollRoot:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      Height: =Parent.Height
      Width: =Parent.Width
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutGap: =0
      FillPortions: =0
      LayoutMinHeight: =0
      LayoutMinWidth: =0
      PaddingTop: =0
      PaddingBottom: =0
      PaddingLeft: =0
      PaddingRight: =0
      DropShadow: =DropShadow.None
      Fill: =UiTheme.Background
    Children:
    - conscrPayrollHeader:
        Control: GroupContainer@1.5.0
        Variant: AutoLayout
        Properties:
          Height: =64
          Width: =Parent.Width
          LayoutDirection: =LayoutDirection.Horizontal
          LayoutAlignItems: =LayoutAlignItems.Center
          LayoutGap: =8
          FillPortions: =0
          LayoutMinHeight: =0
          LayoutMinWidth: =0
          PaddingTop: =0
          PaddingBottom: =0
          PaddingLeft: =16
          PaddingRight: =16
          DropShadow: =DropShadow.None
          Fill: =UiTheme.Header
        Children:
        - lblscrPayrollTitle:
            Control: Label@2.5.1
            Properties:
              Text: ="非常勤給与 ｜ 支給明細画面"
              Height: =56
              Width: =500
              Font: ="Segoe UI"
              Size: =15
              Color: =Color.White
              PaddingLeft: =12
              PaddingRight: =12
              PaddingTop: =4
              PaddingBottom: =4
              FillPortions: =1
              LayoutMinWidth: =0
              FontWeight: =FontWeight.Semibold
        - btnscrPayrollHome:
            Control: ModernButton@1.0.0
            Properties:
              Text: ="ホーム"
              AccessibleLabel: ="ホーム"
              OnSelect: =Navigate(scrHome,ScreenTransition.None)
              Height: =44
              Width: =112
              Font: ="Segoe UI"
              Size: =14
              BasePaletteColor: =UiTheme.Primary
              Appearance: =ButtonAppearance.Outline
              FillPortions: =0
              LayoutMinWidth: =0
              Color: =Color.White
              BorderColor: =Color.White
        - lblscrPayrollId:
            Control: Label@2.5.1
            Properties:
              Text: ="SCR-005"
              Height: =56
              Width: =92
              Font: ="Segoe UI"
              Size: =10
              Color: =Color.White
              PaddingLeft: =12
              PaddingRight: =12
              PaddingTop: =4
              PaddingBottom: =4
              FillPortions: =0
              LayoutMinWidth: =0
              Align: =Align.Right
    - conPayrollTargets:
        Control: GroupContainer@1.5.0
        Variant: AutoLayout
        Properties:
          Height: =If(Parent.Width<900,108,60)
          Width: =Parent.Width
          LayoutDirection: =LayoutDirection.Horizontal
          LayoutAlignItems: =LayoutAlignItems.Stretch
          LayoutGap: =8
          FillPortions: =0
          LayoutMinHeight: =0
          LayoutMinWidth: =0
          PaddingTop: =8
          PaddingBottom: =8
          PaddingLeft: =16
          PaddingRight: =16
          DropShadow: =DropShadow.None
          LayoutWrap: =true
          Fill: =Color.White
        Children:
        - lblPayrollMonth:
            Control: Label@2.5.1
            Properties:
              Text: ="支給対象月"
              Height: =44
              Width: =116
              Font: ="Segoe UI"
              Size: =11
              Color: =UiTheme.Text
              PaddingLeft: =12
              PaddingRight: =12
              PaddingTop: =4
              PaddingBottom: =4
              FillPortions: =0
              LayoutMinWidth: =0
        - ddPayrollMonth:
            Control: Classic/DropDown@2.3.1
            Properties:
              Items: =["2026/09","2026/10","2026/11"]
              Default: =Text(UiMonth,"yyyy/mm")
              OnChange: =Set(varUiMonth,DateValue(Self.Selected.Value & "/01","ja-JP")); Set(varUiResultKey,Blank())
              Height: =44
              Width: =150
              AccessibleLabel: ="支給対象月"
              Font: ="Segoe UI"
              Size: =11
              BorderColor: =UiTheme.Border
              BorderThickness: =1
              Color: =UiTheme.Text
              Fill: =Color.White
              ChevronBackground: =Color.White
              ChevronFill: =UiTheme.Primary
              SelectionFill: =UiTheme.Selected
              SelectionColor: =UiTheme.Text
              FillPortions: =0
              LayoutMinWidth: =0
        - lblPayrollStaff:
            Control: Label@2.5.1
            Properties:
              Text: =If(IsBlank(UiSelected.StaffNo),"対象職員：未選択",UiSelected.StaffNo & "　" & UiSelected.Name & "　｜　" & UiSelected.Org)
              Height: =44
              Width: =Max(260,Parent.Width-650)
              Font: ="Segoe UI"
              Size: =11
              Color: =UiTheme.Text
              PaddingLeft: =12
              PaddingRight: =12
              PaddingTop: =4
              PaddingBottom: =4
              FillPortions: =1
              LayoutMinWidth: =0
        - btnPayrollSearch:
            Control: ModernButton@1.0.0
            Properties:
              Text: ="職員マスタ検索"
              AccessibleLabel: ="職員マスタ検索"
              OnSelect: =Navigate(Screen1,ScreenTransition.None)
              Height: =44
              Width: =168
              Font: ="Segoe UI"
              Size: =14
              BasePaletteColor: =UiTheme.Primary
              Appearance: =ButtonAppearance.Primary
              FillPortions: =0
              LayoutMinWidth: =0
    - lblPayPrototype:
        Control: Label@2.5.1
        Properties:
          Text: ="画面確認用の仮例｜金額・料率・適用区分は未確定"
          Height: =40
          Width: =Parent.Width
          Font: ="Segoe UI"
          Size: =11
          Color: =UiTheme.Primary
          PaddingLeft: =24
          PaddingRight: =12
          PaddingTop: =4
          PaddingBottom: =4
          FillPortions: =0
          LayoutMinWidth: =0
          Fill: =ColorValue("#EAF4FF")
