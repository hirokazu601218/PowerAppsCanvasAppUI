                      Height: =48
                      Width: =230
                      Font: ="Segoe UI"
                      Size: =14
                      Color: =UiTheme.Primary
                      PaddingLeft: =12
                      PaddingRight: =12
                      PaddingTop: =4
                      PaddingBottom: =4
                      FillPortions: =0
                      LayoutMinWidth: =0
                      Align: =Align.Right
                      FontWeight: =FontWeight.Semibold
            - lblPayCommuteBasis:
