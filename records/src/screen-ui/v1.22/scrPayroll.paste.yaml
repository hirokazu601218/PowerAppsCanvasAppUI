                    Control: Label@2.5.1
                    Properties:
                      Text: ="通勤手当"
                      Height: =48
                      Width: =700
                      Font: ="Segoe UI"
                      Size: =13
                      Color: =UiTheme.Header
                      PaddingLeft: =12
                      PaddingRight: =12
                      PaddingTop: =4
                      PaddingBottom: =4
                      FillPortions: =1
                      LayoutMinWidth: =0
                      FontWeight: =FontWeight.Semibold
                - conPayCommuteHeadingAmount:
                    Control: Label@2.5.1
                    Properties:
                      Text: =If(UiReady,If(Mod(UiCommute,1)=0,Text(UiCommute,"#,##0"),"約 " & Text(UiCommute,"#,##0.000000"))
