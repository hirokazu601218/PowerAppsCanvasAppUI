                  Color: =UiTheme.Text
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  Align: =Align.Center
            - lblPaySummaryNetValue:
                Control: Label@2.5.1
