                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  FillPortions: =0
                  LayoutMinWidth: =0
                  Align: =Align.Center
                  FontWeight: =FontWeight.Semibold
    - conPayActions:
        Control: GroupContainer@1.5.0
        Variant: AutoLayout
        Properties:
          Height: =56
          Width: =Parent.Width
          LayoutDirection: =LayoutDirection.Horizontal
          LayoutAlignItems: =LayoutAlignItems.Stretch
          LayoutGap: =8
          FillPortions: =0
          LayoutMinHeight: =0
          LayoutMinWidth: =0
          PaddingTop: =6
          PaddingBottom: =0
          PaddingLeft: =24
          PaddingRight: =0
          DropShadow: =DropShadow.None
          LayoutWrap: =true
        Children:
        - btnPayEarnings:
            Control: ModernButton@1.0.0
            Properties:
              Text: =If(Coalesce(varUiEarningsOpen,true),"▼ 支給の内訳","▶ 支給の内訳")
              AccessibleLabel: =If(Coalesce(varUiEarningsOpen,true),"▼ 支給の内訳","▶ 支給の内訳")
              OnSelect: =Set(varUiEarningsOpen,!Coalesce(varUiEarningsOpen,true))
              Height: =44
              Width: =190
              Font: ="Segoe UI"
              Size: =14
              BasePaletteColor: =UiTheme.Primary
              Appearance: =ButtonAppearance.Primary
              FillPortions: =0
              LayoutMinWidth: =0
        - btnPayDeductions:
            Control: ModernButton@1.0.0
            Properties:
              Text: =If(Coalesce(varUiDeductionsOpen,true),"▼ 控除の内訳","▶ 控除の内訳")
              AccessibleLabel: =If(Coalesce(varUiDeductionsOpen,true),"▼ 控除の内訳","▶ 控除の内訳")
              OnSelect: =Set(varUiDeductionsOpen,!Coalesce(varUiDeductionsOpen,true))
              Height: =44
              Width: =190
              Font: ="Segoe UI"
              Size: =14
              BasePaletteColor: =UiTheme.Primary
              Appearance: =ButtonAppearance.Outline
              FillPortions: =0
              LayoutMinWidth: =0
        - btnPayRecalculate:
            Control: ModernButton@1.0.0
            Properties:
              Text: ="再計算"
              AccessibleLabel: ="再計算"
              OnSelect: =Set(varUiResultKey,Blank()); If(!IsBlank(UiSelected.StaffNo) && UiRegistered,Set(varUiResultKey,UiTargetKey))
              Height: =44
              Width: =136
              Font: ="Segoe UI"
              Size: =14
              BasePaletteColor: =UiTheme.Primary
              Appearance: =ButtonAppearance.Primary
              FillPortions: =0
              LayoutMinWidth: =0
              DisplayMode: =If(IsBlank(UiSelected.StaffNo),DisplayMode.Disabled,DisplayMode.Edit)
    - lblPayState:
        Control: Label@2.5.1
        Properties:
          Text: =UiStatus
          Height: =If(UiReady,0,40)
          Width: =Parent.Width
          Font: ="Segoe UI"
          Size: =11
          Color: =ColorValue("#9F3A00")
          PaddingLeft: =24
          PaddingRight: =12
          PaddingTop: =4
          PaddingBottom: =4
          FillPortions: =0
          LayoutMinWidth: =0
          Visible: =!UiReady
    - conPayBody:
        Control: GroupContainer@1.5.0
        Variant: AutoLayout
        Properties:
          Height: =Parent.Height-64-If(Parent.Width<900,108,60)-40-104-56-If(UiReady,0,40)
          Width: =Parent.Width
          LayoutDirection: =LayoutDirection.Vertical
          LayoutAlignItems: =LayoutAlignItems.Stretch
          LayoutGap: =12
          FillPortions: =0
          LayoutMinHeight: =0
          LayoutMinWidth: =0
