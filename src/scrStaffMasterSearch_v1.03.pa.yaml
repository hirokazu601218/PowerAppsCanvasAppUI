# 非常勤職員マスタ検索・選択画面 v1.03
# 参照: 職員マスタ検索ダッシュボード v0.807 基本設計書・詳細設計書・HTML
# 前提: DADS_PowerApps_AppFormulas_デザイントークン_v1.0.fx を App.Formulas に設定済み
# 用途: Power Apps Studio のツリービューへ全体を貼り付ける
# v1.03: HTML版の左400px・右可変レイアウトと表形式詳細を再現。データソース不要のテスト版。

Screens:
  scrStaffMasterSearch_v103:
    Properties:
      Fill: =DadsTokens.Color.BackgroundSubtle
      LoadingSpinnerColor: =DadsTokens.Color.Primary
      OnVisible: |-
        =ClearCollect(
            colStaffUiSample,
            ForAll(
                Sequence(25) As seq,
                With(
                    {n: seq.Value},
                    {
                        職員番号: Text(100 + n, "000000"),
                        氏名: Switch(n, 1, "山田 太郎", 2, "佐藤 花子", 3, "鈴木 一郎", 4, "高橋 美咲", 5, "田中 次郎", 6, "伊藤 健太", 7, "渡辺 直美", 8, "小林 大輔", 9, "加藤 由美", 10, "吉田 翔太", 11, "山本 恵", 12, "中村 拓海", 13, "斎藤 真理", 14, "松本 和也", 15, "井上 彩", 16, "木村 亮", 17, "林 奈々", 18, "清水 誠", 19, "山口 愛", 20, "森 健一", 21, "池田 遥", 22, "橋本 学", 23, "阿部 由紀", 24, "石川 翼", "前田 美穂"),
                        所属: Switch(Mod(n - 1, 5), 0, "総務課", 1, "会計課", 2, "人事課", 3, "調査課", "企画課"),
                        組織名略称: Switch(Mod(n - 1, 5), 0, "総務", 1, "会計", 2, "人事", 3, "調査", "企画"),
                        在籍状態: If(Mod(n, 7) = 0, "退職", "在籍"),
                        生年月日: Date(1975 + Mod(n, 23), 1 + Mod(n, 12), 1 + Mod(n * 3, 27)),
                        性別: If(Mod(n, 2) = 0, "女性", "男性"),
                        採用日: Date(2022 + Mod(n, 5), 4, 1),
                        退職日: If(Mod(n, 7) = 0, Date(2026, 3, 31), Blank())
                    }
                )
            )
        );
        ClearCollect(
            colStaffWorkSample,
            ForAll(colStaffUiSample As s, {職員番号:s.職員番号, 適用開始日:Date(2026,4,1), 適用終了日:Blank(), 日額単価:9300 + Value(Right(s.職員番号,2))*50, 所定勤務時間:"7:45", 勤務時間:"8:00", 超勤基礎単価:1640 + Value(Right(s.職員番号,2))*5, 異動区分:"非常勤採用", 発令事由区分:"継続", 勤務終了:"16:45", 一日時間:7.75})
        );
        ClearCollect(
            colStaffCommuteSample,
            ForAll(colStaffUiSample As s, {職員番号:s.職員番号, 適用開始日:Date(2026,4,1), 適用終了日:Blank(), 支給方式:If(Mod(Value(Right(s.職員番号,2)),2)=0,"毎月支給","半年定期"), 通勤4月:8400, 通勤10月:8400, 通勤認定ID:"TK-" & s.職員番号})
        );
        ClearCollect(
            colStaffSocialSample,
            ForAll(colStaffUiSample As s, {職員番号:s.職員番号, 職員雇用区分:"専門職員", 生年月日:s.生年月日, 年齢4月:Year(Date(2026,4,1))-Year(s.生年月日), 年齢3月:Year(Date(2027,3,1))-Year(s.生年月日), 介護徴収該当:"全月該当", 厚生年金免除:"全月該当なし", 後期高齢者徴収:"全月該当なし", 厚生年金級:12, 厚生月額:220000})
        );
        ClearCollect(
            colStaffResidentSample,
            ForAll(colStaffUiSample As s, {職員番号:s.職員番号, 年:2026, 住所コード:"13101", 徴収開始年月:"2026/06", 徴収終了年月:"2027/05", 特別徴収税額:120000, 月割開始月分:10000, 月割翌月以降:10000})
        );
        ClearCollect(
            colStaffTaxSample,
            ForAll(colStaffUiSample As s, {職員番号:s.職員番号, 適用開始日:Date(2026,1,1), 税表区分:"甲欄", 扶養人数:Mod(Value(Right(s.職員番号,2)),3), 雇用保険:"加入", 固定控除名:"互助会費", 固定控除額:1500})
        );
        ClearCollect(
            colStaffPayrollSample,
            ForAll(colStaffUiSample As s, {職員番号:s.職員番号, 給与期間対象年:2026, 支給年月日:Date(2026,9,18), 俸給当月:186000, 俸給追給:0, 通勤当月:8400, 通勤追給:0, 在宅当月:0, 在宅追給:0, 超勤当月:12500, 超勤追給:0, 給与支給総額:206900, 控除当月:32800, 控除追給:0, 現金支給額:174100, 備考:"サンドボックス用テストデータ"})
        );
        ClearCollect(colStaffOrgOptions, {Value:"すべて"});
        ForAll(Sort(Distinct(colStaffUiSample, 所属), Value), Collect(colStaffOrgOptions, {Value:ThisRecord.Value}));
        ClearCollect(colStaffStatusOptions, {Value:"すべて"}, {Value:"在籍"}, {Value:"退職"});
        ClearCollect(colStaffSearchResult, colStaffUiSample);
        Set(varStaffPage,1);
        Set(varSelectedStaff,First(colStaffSearchResult));
        Set(varStaffDataLoadedAt,Now());
        Set(varShowStaffExportPreview,false);
        Set(varShowCommutePreview,false);
        Set(varShowPayrollPreview,false);
        Set(varStaffLastAction,"テストデータ25名を読み込みました")
    Children:
