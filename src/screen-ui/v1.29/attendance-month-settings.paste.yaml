- conAttendanceMonthSettings:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: =32
      Y: =160
      Width: =Parent.Width-64
      Height: =340
      Fill: =Color.White
    Children:
    - lblAttendanceMonthSettings:
        Control: Label@2.5.1
        Properties:
          Text: ="勤務報告対象月の設定"
          X: =20
          Y: =16
          Width: =650
          Height: =40
          Size: =18
    - txtAttendanceTargetMonth:
        Control: Classic/TextInput@2.3.2
        Properties:
          Default: ="2026-08"
          HintText: ="yyyy-mm"
          X: =20
          Y: =72
          Width: =200
          Height: =40
    - btnAttendanceMonthEnable:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="対象月に設定"
          X: =240
          Y: =72
          Width: =160
          Height: =40
          OnSelect: =Set(varAttendanceMonthBusy,true); IfError(Set(varAttendanceMonthReply,ParseJSON(SCR003_勤務時間報告_Excel取込_開発中.Run(JSON({operation:"month",expectedVersion:0,month:Trim(txtAttendanceTargetMonth.Text),enabled:true},JSONFormat.Compact)).resultjson)); Set(varAttendanceMonthResult,Text(varAttendanceMonthReply.message)); Refresh(M_勤務報告対象月),Set(varAttendanceMonthResult,FirstError.Message)); Set(varAttendanceMonthBusy,false)
          DisplayMode: =If(Coalesce(varAttendanceMonthBusy,false),DisplayMode.Disabled,DisplayMode.Edit)
    - btnAttendanceMonthDisable:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="対象月から外す"
          X: =420
          Y: =72
          Width: =160
          Height: =40
          OnSelect: =Set(varAttendanceMonthBusy,true); IfError(Set(varAttendanceMonthReply,ParseJSON(SCR003_勤務時間報告_Excel取込_開発中.Run(JSON({operation:"month",expectedVersion:0,month:Trim(txtAttendanceTargetMonth.Text),enabled:false},JSONFormat.Compact)).resultjson)); Set(varAttendanceMonthResult,Text(varAttendanceMonthReply.message)); Refresh(M_勤務報告対象月),Set(varAttendanceMonthResult,FirstError.Message)); Set(varAttendanceMonthBusy,false)
          DisplayMode: =If(Coalesce(varAttendanceMonthBusy,false),DisplayMode.Disabled,DisplayMode.Edit)
    - lblAttendanceMonthSaveResult:
        Control: Label@2.5.1
        Properties:
          Text: =Coalesce(varAttendanceMonthResult,"") & Char(10) & "現在の対象月：" & Concat(SortByColumns(Filter(M_勤務報告対象月,報告対象=true),"crb3c_workmonth",SortOrder.Ascending),Text(勤務月,"yyyy-mm"),"、")
          X: =20
          Y: =132
          Width: =Parent.Width-40
          Height: =130
    - btnAttendanceMonthToReport:
        Control: ModernButton@1.0.0
        Properties:
          Text: ="勤務時間報告へ"
          X: =20
          Y: =280
          Width: =180
          Height: =40
          OnSelect: =Navigate(scrAttendanceFormal,ScreenTransition.None)
