                              ID: If(IsEmpty(colTestKojo), 1, Max(colTestKojo, ID) + 1),
                              KJ_kyuyo_shiharai_group: selected_Kyuyo_shiharai_group,
                              KJ_kinmu_kb: "2非常勤",
