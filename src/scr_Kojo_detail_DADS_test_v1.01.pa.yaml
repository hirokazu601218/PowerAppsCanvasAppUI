# 控除詳細 DADSベース サンドボックステスト版 v1.01
# 対応基準: DADS_PowerApps_デザイン基準_v1.01
# 前提: DADS_PowerApps_AppFormulas_デザイントークン_v1.0.fx を App.Formulas に設定済み
# 原本: scr_Kojo_detail_DADS_v1.0.pa.yaml
# テスト方式: Screen.OnVisibleでPower Fxコレクションを初期化
# 外部データソース: 不要
# 注意: テストデータと編集結果はアプリ終了時に破棄される
# v1.2変更: ギャラリー内の横位置基準をテンプレート幅からギャラリー実幅へ修正
# v1.2変更: 上段ヘッダーをギャラリー外へ移し、タイトル・戻る・更新情報を常時表示
# v1.3変更: ギャラリー子要素の幅・横位置を名前付きギャラリーの実幅へ直接接続
# v1.3変更: Parent依存を排除し、Power Apps Studio貼り付け後の左側圧縮を防止
# v1.4変更: 標準16:9（1366×768）を基準にギャラリー子要素のX・Widthを固定値化
# v1.4変更: Studio側でギャラリー幅が448px相当として解釈されても配置を維持
# v1.01変更: Studio貼り付け時にギャラリー直下のXが0へ再配置される事象へ対応
# v1.01変更: 3つの単一レコード表示ギャラリーをManualLayoutコンテナへ変更
#
# 再設計内容:
# - 16:9画面を横いっぱいに使い、左右余白を24px/32pxに統一
# - 固定20px高・10pt中心の密集配置を、36～48px高・14～16pt中心へ拡大
# - 上段を職員、税・区分、共済、社会保険、貯金・貸付の5区分へ整理
# - 編集行を4区分へ整理し、縦スクロールで項目の重なりを防止
# - 既存のデータ参照、追加、編集、保存、削除、戻る処理を維持
# - ボタンはモダンコントロールを使用
# - 編集ギャラリー内の入力コントロールは、既存のSelectedText/Value等の
#   保存式との互換性を維持するためクラシックを継続使用

