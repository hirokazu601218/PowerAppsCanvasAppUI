                        - icn_Kojo_detail_back:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =DadsTokens.Color.TextOnPrimary
                              DisplayMode: |-
                                =//編集モードを変更します
                                //If(visible_display_Kojo_edit= true ,DisplayMode.Disabled);
                                DisplayMode.Edit
                              Height: =48
                              Icon: =Icon.BackArrow
                              OnSelect: |
                                =//編集モードを切り替えます
                                UpdateContext({visible_display_Kojo_edit: false});
                                Patch(
                                    M_Shokuin,
                                    ThisItem,
                                    {
                                        基礎所得税表区分: lbl_kojo_detail_shotoku_zei_hyo_kb.Text,
                                        基礎扶養控除人数: Value(lbl_kojo_detail_fuyokojo_ninzu.Text),
                                        基礎共済区分: lbl_kojo_detail_kyosai_kb.Text,
                                        基礎雇用保険対象: If(
                                            lbl_kojo_detail_koyo_hoken_yn.Text = "対象",
                                            true,
                                            false
                                        ),
                                        '＜共済＞短期・等級': If(
                                            IsBlank(Value(lbl_kojo_detail_hjh_tanki_kyu.Text)),
                                            0,
                                            Value(lbl_kojo_detail_hjh_tanki_kyu.Text)
                                        ),
                                        '＜共済＞厚生年金・等級': If(
                                            IsBlank(Value(lbl_kojo_detail_hjh_choki_kyu.Text)),
                                            0,
                                            Value(lbl_kojo_detail_hjh_choki_kyu.Text)
                                        ),
                                        '＜共済＞短期・月額': If(
                                            IsBlank(Value(lbl_kojo_detail_hjh_tanki_gaku.Text)),
                                            0,
                                            Value(lbl_kojo_detail_hjh_tanki_gaku.Text)
                                        ),
                                        '＜共済＞厚生年金・月額': If(
                                            IsBlank(Value(lbl_kojo_detail_hjh_choki_gaku.Text)),
                                            0,
                                            Value(lbl_kojo_detail_hjh_choki_gaku.Text)
                                        ),
                                        '＜共済＞短期掛金': If(
                                            Value(lbl_kojo_detail_tanki_kake_kotei.Text) <> 0,
                                            Value(lbl_kojo_detail_tanki_kake_kotei.Text),
                                            0
                                        ),
                                        '＜共済＞厚生年金保険料': If(
                                            Value(lbl_kojo_detail_choki_kake_kotei.Text) <> 0,
                                            Value(lbl_kojo_detail_choki_kake_kotei.Text),
                                            0
                                        ),
                                        '＜共済＞退職等年金掛金': If(
                                            Value(lbl_kojo_detail_taishokutou_kake_kotei.Text) <> 0,
                                            Value(lbl_kojo_detail_taishokutou_kake_kotei.Text),
                                            0
                                        ),
