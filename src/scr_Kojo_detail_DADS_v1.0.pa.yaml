# 控除詳細 DADSベース再設計版 v1.0
# 対応基準: DADS_PowerApps_デザイン基準_v1.01
# 前提: DADS_PowerApps_AppFormulas_デザイントークン_v1.0.fx を App.Formulas に設定済み
# 原本: 別アプリの scr_Kojo_detail
#
# 再設計内容:
# - 16:9画面を横いっぱいに使い、左右余白を24px/32pxに統一
# - 固定20px高・10pt中心の密集配置を、36～48px高・14～16pt中心へ拡大
# - 上段を職員、税・区分、共済、社会保険、貯金・貸付の5区分へ整理
# - 編集行を4区分へ整理し、縦スクロールで項目の重なりを防止
# - 既存のデータ参照、追加、編集、保存、削除、戻る処理を維持
# - ボタンはモダンコントロールを使用
# - 編集ギャラリー内の入力コントロールは、既存のSelectedText/Value等の
#   保存式との互換性を維持するためクラシックを継続使用

Screens:
  scr_Kojo_detail:
    Properties:
      LoadingSpinnerColor: =DadsTokens.Color.Primary
      OnVisible: |-
        =//編集モードを切り替えます
        UpdateContext({visible_display_Kojo_edit: false});
      Fill: =DadsTokens.Color.BackgroundSubtle
    Children:
      - conKojoDadsRoot:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =DadsTokens.Color.BackgroundSubtle
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =DadsTokens.Space.L
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =DadsTokens.Space.L
            PaddingLeft: =If(IsMobileLayout, DadsTokens.Space.M, DadsTokens.Space.L)
            PaddingRight: =If(IsMobileLayout, DadsTokens.Space.L, DadsTokens.Space.XL)
            PaddingTop: =DadsTokens.Space.L
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - cnt_Kojo_detail_kiso:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =448
                  RadiusBottomLeft: =DadsTokens.Radius.Card
                  RadiusBottomRight: =DadsTokens.Radius.Card
                  RadiusTopLeft: =DadsTokens.Radius.Card
                  RadiusTopRight: =DadsTokens.Radius.Card
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  BorderColor: =DadsTokens.Color.Border
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =DadsTokens.Border.WidthDefault
                  Fill: =DadsTokens.Color.Surface
