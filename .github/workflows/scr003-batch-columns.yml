name: SCR-003 batch columns migration
on:
  push:
    branches: [feat/scr003-attendance-import-20260929]
    paths:
      - '.github/workflows/scr003-batch-columns.yml'
      - 'scripts/automation/add_scr003_batch_fields.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check migration source
        run: python3 -m py_compile scripts/automation/add_scr003_batch_fields.py
      - uses: azure/login@v2
        with:
          client-id: 1c94f011-c447-4af1-968f-ec564f489395
          tenant-id: a00c92fa-e1db-4aa6-ab28-356c3203353d
          allow-no-subscriptions: true
      - name: Add and read back staged batch columns
        run: python3 -u scripts/automation/add_scr003_batch_fields.py
