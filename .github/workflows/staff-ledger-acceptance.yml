name: Staff ledger v1.17 read-only acceptance
on:
  push:
    branches: [automation/change-ledger-v117]
    paths: [.github/workflows/staff-ledger-acceptance.yml, e2e/hybrid/**]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 20
    env:
      MS_AUTH_CREDENTIAL_TYPE: ${{ vars.POWERAPPS_AUTH_MODE || 'password' }}
      MS_AUTH_CREDENTIAL_PROVIDER: ${{ vars.POWERAPPS_AUTH_PROVIDER || 'environment' }}
      MS_AUTH_ENV_VARIABLE_NAME: MS_USER_PASSWORD
      MS_AUTH_LOCAL_FILE_PATH: ../../cert/powerapps-test-user.pfx
      MS_AUTH_HEADLESS: true
      MS_AUTH_WAIT_FOR_MSAL_TOKENS: true
      MS_AUTH_MSAL_TOKEN_TIMEOUT: 60000
      HEADLESS: true
      CI: true
      POWER_APPS_BASE_URL: https://make.powerapps.com
      POWER_APPS_ENVIRONMENT_ID: 68e00049-b7e5-eda6-9888-9a3cc493c5be
      CANVAS_APP_URL: https://apps.powerapps.com/play/e/68e00049-b7e5-eda6-9888-9a3cc493c5be/a/362ac991-eead-4f07-8373-afdb3ebfdba1?tenantId=a00c92fa-e1db-4aa6-ab28-356c3203353d
      EXPECTED_LABEL: v1.17 ／ Dataverse・25名
      WORKERS: 1
      RETRIES: 0
      TEST_TIMEOUT: 180000
      OUTPUT_DIRECTORY: ./test-results
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Enforce originating Work deadline
        run: |
          python - <<'PY'
          import datetime
          start=datetime.datetime.fromisoformat('2026-09-16T13:57:16Z'.replace('Z','+00:00'))
          assert (datetime.datetime.now(datetime.timezone.utc)-start).total_seconds()<2400, 'Work deadline: insufficient time for 20-minute read-only job'
          PY
      - uses: actions/checkout@v4
        with:
          repository: microsoft/power-platform-playwright-samples
          ref: 43e3db8d131aeb09415b1faef030e783fd2e320f
          path: power-platform-playwright
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power-platform-playwright/package-lock.json
      - name: Install the existing pinned toolkit
        working-directory: power-platform-playwright
        run: npm ci
      - name: Build the existing toolkit
        working-directory: power-platform-playwright
        run: npm run build
      - name: Install Chromium
        working-directory: power-platform-playwright/packages/e2e-tests
        # Retry a transient package mirror synchronization failure once; keep all integrity checks.
        run: npx playwright install chromium --with-deps || npx playwright install chromium --with-deps
      - name: Prepare existing certificate configuration
        if: ${{ vars.POWERAPPS_AUTH_MODE == 'certificate' }}
        env:
          TEST_CERT_BASE64: ${{ secrets.POWERAPPS_TEST_CERT_BASE64 }}
        run: |
          mkdir -p power-platform-playwright/cert
          printf '%s' "$TEST_CERT_BASE64" | base64 --decode > power-platform-playwright/cert/powerapps-test-user.pfx
          chmod 600 power-platform-playwright/cert/powerapps-test-user.pfx
      - name: Diagnose authentication using the unchanged official flow
        id: auth
        working-directory: power-platform-playwright/packages/e2e-tests
        env:
          MS_AUTH_EMAIL: ${{ secrets.POWERAPPS_TEST_EMAIL }}
          MS_USER_PASSWORD: ${{ secrets.POWERAPPS_TEST_PASSWORD }}
          MS_AUTH_CERTIFICATE_PASSWORD: ${{ secrets.POWERAPPS_TEST_CERT_PASSWORD }}
        run: |
          test "$MS_AUTH_EMAIL" = "powerapps-test@govaca.onmicrosoft.com"
          npm run auth
      - name: Preserve only the library's failed-screen PNG
        if: ${{ failure() && steps.auth.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: staff-master-auth-diagnostic-${{ github.run_id }}
          path: power-platform-playwright/packages/e2e-tests/.playwright-ms-auth/screenshots/*-failed-*.png
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - name: Install full hybrid acceptance tests
        run: |
          mkdir -p power-platform-playwright/packages/e2e-tests/tests/northwind/canvas/hybrid
          cp project/e2e/hybrid/*.test.ts power-platform-playwright/packages/e2e-tests/tests/northwind/canvas/hybrid/
      - name: Install PDF inspection dependency
        run: python -m pip install pypdf==5.3.0
      - name: Verify Dataverse, P0, responsive UI, histories and ledger
        id: access
        working-directory: power-platform-playwright/packages/e2e-tests
        env:
          MS_AUTH_EMAIL: ${{ secrets.POWERAPPS_TEST_EMAIL }}
        run: npx playwright test tests/northwind/canvas/hybrid --project=canvas-app --trace=off --retries=0 --reporter=line
      - name: Preserve synthetic application screenshots only
        if: ${{ always() && steps.auth.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dataverse-read-only-${{ github.run_id }}
          path: |
            power-platform-playwright/packages/e2e-tests/test-results/**/*.png
            power-platform-playwright/packages/e2e-tests/test-results/ledger-*.pdf
            power-platform-playwright/packages/e2e-tests/test-results/ledger-*.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/setup-dotnet@v4
        if: ${{ always() && steps.auth.outcome == 'success' }}
        with:
          dotnet-version: '10.0.x'
      - name: Download the saved app using existing automation access
        if: ${{ always() && steps.auth.outcome == 'success' }}
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.12.2
          pac auth create --name hybrid-readback --githubFederated --tenant a00c92fa-e1db-4aa6-ab28-356c3203353d --applicationId 1c94f011-c447-4af1-968f-ec564f489395 --environment https://orge762dd9e.crm7.dynamics.com/
          mkdir -p project/artifacts/hybrid
          pac canvas download --name 362ac991-eead-4f07-8373-afdb3ebfdba1 --file-name project/artifacts/hybrid/readback.msapp --environment https://orge762dd9e.crm7.dynamics.com/ --overwrite
      - name: Verify source and compiled rules
        if: ${{ always() && steps.auth.outcome == 'success' }}
        working-directory: project
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.automation.bridge import verify_download, read_archive
          p=Path('artifacts/hybrid/readback.msapp')
          result=verify_download(p,Path('.'),json.loads(Path('automation/change.json').read_text()))
          actual=read_archive(p); baseline=read_archive('powerapps/dataverse-v1.15/staff-master.msapp')
          for name in ['Connections/Connections.json','References/DataSources.json']:
              if name in baseline: assert json.loads(actual[name])==json.loads(baseline[name]), name
          Path('artifacts/hybrid/readback-result.json').write_text(json.dumps(result,indent=2))
          print(result)
          PYCODE
      - name: Preserve saved package and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-readback-${{ github.run_id }}
          path: project/artifacts/hybrid
          retention-days: 14
          if-no-files-found: warn
      - name: Record diagnostic scope
        if: always()
        run: echo 'Read-only acceptance of Studio-published v1.17. No role change, app import or rollback. Dedicated user; 8 tests including P0 and four UI regressions. Old v1.14 fixtures retained separately.' >> "$GITHUB_STEP_SUMMARY"
