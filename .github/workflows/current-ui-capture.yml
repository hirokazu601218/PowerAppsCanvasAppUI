name: Capture approved SCR001-003 published UI
on:
  push:
    branches: [change/20261001-scr001-003-ui]
    paths: [config/verification/ui-20261001-capture.json]
permissions:
  contents: read
jobs:
  capture-readback:
    name: Capture current published app metadata and package digest
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TENANT_ID: a00c92fa-e1db-4aa6-ab28-356c3203353d
      DATAVERSE_URL: https://orge762dd9e.crm7.dynamics.com/
      CURRENT_APP_ID: 204a48dc-7f23-43dd-b934-4654a3cfa306
      TEST_USER: ${{ secrets.POWERAPPS_TEST_EMAIL }}
      TEST_PASS: ${{ secrets.POWERAPPS_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download current package and check the saved screen definition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postpublish"
          test "$TEST_USER" = 'powerapps-test@govaca.onmicrosoft.com'
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.12.2
          az login --username "$TEST_USER" --password "$TEST_PASS" \
            --tenant "$TENANT_ID" --allow-no-subscriptions --output none
          python3 scripts/automation/read_current_app_metadata.py --output "$RUNNER_TEMP/postpublish/before.json"
          pac auth create --name current-app-capture \
            --username "$TEST_USER" --password "$TEST_PASS" --environment "$DATAVERSE_URL"
          pac canvas download --name "$CURRENT_APP_ID" \
            --file-name "$RUNNER_TEMP/postpublish/readback.msapp" \
            --environment "$DATAVERSE_URL" --overwrite
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          candidate = Path(os.environ['RUNNER_TEMP']) / 'postpublish/readback.msapp'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as result:
              result.write('PAC取得候補 SHA-256: `' + hashlib.sha256(candidate.read_bytes()).hexdigest() +
                           '`。公開版との一致は未判定。\n')
          PY
          python3 scripts/automation/read_current_app_metadata.py --output "$RUNNER_TEMP/postpublish/after.json"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'postpublish'
          before = json.loads((root / 'before.json').read_text())
          after = json.loads((root / 'after.json').read_text())
          app = os.environ['CURRENT_APP_ID']
          prefix = ('https://apps.powerapps.com/play/e/'
                    '68e00049-b7e5-eda6-9888-9a3cc493c5be/a/' + app + '?')
          for data in (before, after):
              if data.get('status') != 'Ready' or not str(data.get('appOpenUri', '')).startswith(prefix):
                  raise SystemExit('metadata is not Ready or does not point to the fixed app')
          if before != after:
              raise SystemExit('app metadata changed during package download')
          package = root / 'readback.msapp'
          package_sha = hashlib.sha256(package.read_bytes()).hexdigest()
          # This capture checks the currently approved v25 screen. The earlier
          # v22 saved-screen digest is a different release and must not gate it.
          expected = '5ed3f500ee82338f6ad825102dbec83d3fd0119739f0d72dcd66fa7dc6cabd99'
          with zipfile.ZipFile(package) as archive:
              screen = next(name for name in archive.namelist()
                            if name.replace('\\', '/').endswith('Src/scrStaffMasterSearch.pa.yaml'))
              screen_sha = hashlib.sha256(archive.read(screen)).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## 現行アプリ公開版の読戻し（文書照合前）\n')
              output.write(f'- App ID: `{app}`\n')
              output.write(f'- 公開時刻: `{before["lastPublishTime"]}`\n')
              output.write(f'- 最終下書き版: `{before["lastDraftVersion"]}`\n')
              output.write(f'- msapp SHA-256: `{package_sha}`\n')
              output.write(f'- SCR-002画面定義SHA-256: `{screen_sha}`\n')
              output.write(f'- 20261001保存画面の記録済みSHAとの一致: `{screen_sha == expected}`\n')
              output.write('パッケージ本体と認証情報はアップロードしていません。全画面・接続の一致は別の検査が必要です。\n')
          (root / 'capture.json').write_text(json.dumps({'metadata': before, 'package_sha256': package_sha, 'scr002_sha256': screen_sha}, ensure_ascii=False, indent=2))
          if screen_sha != expected:
              raise SystemExit('published SCR-002 screen differs from approved 20261001 Studio readback; investigate before reconciliation')
          PY
      - name: Report capture failure without changing app sharing
        if: ${{ failure() }}
        run: |
          echo '公開版の読戻しに失敗しました。対象App ID・認証・アプリ権限を確認してください。' >> "$GITHUB_STEP_SUMMARY"
          echo '共有先の追加・削除や共同所有者の入替えは行っていません。' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: current-ui-capture
          path: ${{ runner.temp }}/postpublish/capture.json
          retention-days: 7

