name: Repair v1.14 README and verify release snapshot guards
on:
  push:
    branches: [main]
    paths: [.github/workflows/staff-master-tag-documentation-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify automation and README/tag regression tests
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s tests/automation -v
      - name: Archive original v1.14 and correct only its README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automation/repair_v114_readme.py
      - name: Preserve correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-master-tag-documentation-repair-${{ github.run_id }}
          path: |
            artifacts/tag-documentation-repair
            artifacts/release/readme-update.json
          retention-days: 14
