name: SCR-003 disabled draft flow deployment
on:
  push:
    branches: [feat/scr003-attendance-import-20260929]
    paths: ['.github/workflows/scr003-flow-deploy.yml', 'scripts/automation/deploy_scr003_flow.py', 'scripts/automation/build_scr003_flow.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - run: pip install jsonschema
      - name: Validate candidate source
        run: python3 -m unittest discover -s tests/automation -p test_scr003_flow.py -v
      - uses: azure/login@v2
        with:
          client-id: 1c94f011-c447-4af1-968f-ec564f489395
          tenant-id: a00c92fa-e1db-4aa6-ab28-356c3203353d
          allow-no-subscriptions: true
      - name: Update disabled draft and read back
        run: python3 -u scripts/automation/deploy_scr003_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scr003-disabled-draft-recovery
          path: scr003-draft-backup/
          retention-days: 1
