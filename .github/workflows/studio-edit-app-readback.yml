name: Studio edit app saved package readback
on:
  push:
    branches: [work/studio-edit-isolated-crud]
    paths: [.github/workflows/studio-edit-app-readback.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check Work deadline
        run: |
          python - <<'PY'
          import json,time
          from datetime import datetime
          r=json.load(open('automation/studio-edit-run.json'))
          assert 3600-(time.time()-datetime.fromisoformat(r['started_at']).timestamp())>600,'PAUSED_TIME_LIMIT'
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download editing copy only
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.12.2
          pac auth create --name studio-copy-readback --githubFederated --tenant a00c92fa-e1db-4aa6-ab28-356c3203353d --applicationId 1c94f011-c447-4af1-968f-ec564f489395 --environment https://orge762dd9e.crm7.dynamics.com/
          mkdir -p artifacts/studio-app
          pac canvas download --name 204a48dc-7f23-43dd-b934-4654a3cfa306 --file-name artifacts/studio-app/studio-edit.msapp --environment https://orge762dd9e.crm7.dynamics.com/ --overwrite
          sha256sum artifacts/studio-app/studio-edit.msapp > artifacts/studio-app/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-edit-app-${{ github.run_id }}
          path: artifacts/studio-app
          retention-days: 14
