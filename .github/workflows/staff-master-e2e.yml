name: Staff Master E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-master-e2e
  cancel-in-progress: false

jobs:
  staff-master-p0:
    name: Staff master P0 test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OFFICIAL_SAMPLES_REF: 43e3db8d131aeb09415b1faef030e783fd2e320f
      POWER_APPS_BASE_URL: https://make.powerapps.com
      POWER_APPS_ENVIRONMENT_ID: 2fa12587-ea8f-ee93-ac2f-054f6b7fe2bb
      CANVAS_APP_URL: ${{ vars.POWERAPPS_STAFF_APP_URL }}
      MS_AUTH_EMAIL: ${{ secrets.POWERAPPS_TEST_EMAIL }}
      MS_AUTH_CREDENTIAL_TYPE: ${{ vars.POWERAPPS_AUTH_MODE || 'password' }}
      MS_AUTH_CREDENTIAL_PROVIDER: ${{ vars.POWERAPPS_AUTH_PROVIDER || 'environment' }}
      MS_AUTH_ENV_VARIABLE_NAME: MS_USER_PASSWORD
      MS_USER_PASSWORD: ${{ secrets.POWERAPPS_TEST_PASSWORD }}
      MS_AUTH_LOCAL_FILE_PATH: ../../cert/powerapps-test-user.pfx
      MS_AUTH_CERTIFICATE_PASSWORD: ${{ secrets.POWERAPPS_TEST_CERT_PASSWORD }}
      MS_AUTH_HEADLESS: true
      MS_AUTH_WAIT_FOR_MSAL_TOKENS: true
      MS_AUTH_MSAL_TOKEN_TIMEOUT: 60000
      HEADLESS: true
      WORKERS: 1
      RETRIES: 1
      TEST_TIMEOUT: 120000
      OUTPUT_DIRECTORY: ./test-results
      CI: true

    steps:
      - name: Validate staff app URL
        shell: bash
        run: |
          if [[ -z "$CANVAS_APP_URL" ]]; then
            echo "::error::Repository variable POWERAPPS_STAFF_APP_URL is not set"
            exit 1
          fi

      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Check out Microsoft Power Platform Playwright samples
        uses: actions/checkout@v4
        with:
          repository: microsoft/power-platform-playwright-samples
          ref: ${{ env.OFFICIAL_SAMPLES_REF }}
          path: power-platform-playwright

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: power-platform-playwright/package-lock.json

      - name: Validate test user secrets
        shell: bash
        run: |
          test -n "$MS_AUTH_EMAIL"
          test -n "$MS_USER_PASSWORD"

      - name: Prepare certificate authentication
        if: ${{ vars.POWERAPPS_AUTH_MODE == 'certificate' }}
        shell: bash
        env:
          TEST_CERT_BASE64: ${{ secrets.POWERAPPS_TEST_CERT_BASE64 }}
        run: |
          mkdir -p power-platform-playwright/cert
          printf '%s' "$TEST_CERT_BASE64" | base64 --decode > power-platform-playwright/cert/powerapps-test-user.pfx
          chmod 600 power-platform-playwright/cert/powerapps-test-user.pfx

      - name: Install official toolkit dependencies
        working-directory: power-platform-playwright
        run: npm install

      - name: Build official toolkit
        working-directory: power-platform-playwright
        run: npm run build

      - name: Install Chromium
        working-directory: power-platform-playwright/packages/e2e-tests
        run: npx playwright install chromium --with-deps

      - name: Add staff master P0 test
        shell: bash
        run: cp project/e2e/staff-master-p0.test.ts power-platform-playwright/packages/e2e-tests/tests/northwind/canvas/staff-master-p0.test.ts

      - name: Authenticate to Power Apps
        working-directory: power-platform-playwright/packages/e2e-tests
        run: npm run auth

      - name: Run staff master P0 test
        working-directory: power-platform-playwright/packages/e2e-tests
        run: npx playwright test tests/northwind/canvas/staff-master-p0.test.ts --project=canvas-app

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-master-evidence-${{ github.run_number }}
          path: |
            power-platform-playwright/packages/e2e-tests/test-results/
            power-platform-playwright/packages/e2e-tests/playwright-report/
          if-no-files-found: warn
          retention-days: 30
