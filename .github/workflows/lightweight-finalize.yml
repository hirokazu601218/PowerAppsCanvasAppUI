name: Finalize qualified lightweight baseline
on:
  push:
    branches: [main]
    paths: [automation/lightweight-transaction.json]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: azure/login@v2
        with:
          client-id: 1c94f011-c447-4af1-968f-ec564f489395
          tenant-id: a00c92fa-e1db-4aa6-ab28-356c3203353d
          allow-no-subscriptions: true
      - name: Verify exact candidate and current publication, prepare README and attest baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automation/lightweight_finalize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightweight-finalize-${{ github.run_id }}
          path: artifacts/lightweight-finalize/receipt.json
          retention-days: 14
