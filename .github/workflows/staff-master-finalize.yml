name: Finalize tested Staff Master release
on:
  push:
    branches: [main]
    paths:
      - automation/run.json
      - .github/workflows/staff-master-finalize.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact tested tree and create the success tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automation/finalize_release.py
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-master-release-${{ github.run_id }}
          path: artifacts/release
          retention-days: 14
          if-no-files-found: warn
