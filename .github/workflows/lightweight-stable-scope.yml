name: Lightweight stable solution scope read only
'on':
  push:
    branches: [feat/lightweight-v127-20260924]
    paths: [automation/lightweight-stable-scope-request.txt]
permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m py_compile scripts/automation/lightweight_stable_scope_probe.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.12.2
      - uses: azure/login@v2
        with:
          client-id: 1c94f011-c447-4af1-968f-ec564f489395
          tenant-id: a00c92fa-e1db-4aa6-ab28-356c3203353d
          allow-no-subscriptions: true
      - name: Export stable solution and inspect scope without import
        run: python -u scripts/automation/lightweight_stable_scope_probe.py
      - name: Preserve result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-stable-scope-${{ github.run_id }}
          path: artifacts/lightweight-stable-scope/result.json
          retention-days: 14
