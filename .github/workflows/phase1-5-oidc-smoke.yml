name: Phase 1.5 baseline export

on:
  push:
    branches:
      - automation/phase1-baseline
    paths:
      - .github/workflows/phase1-5-oidc-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  export-baseline:
    name: Export baseline Solution and canvas app
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 20
    env:
      POWER_PLATFORM_TENANT_ID: a00c92fa-e1db-4aa6-ab28-356c3203353d
      POWER_PLATFORM_CLIENT_ID: 1c94f011-c447-4af1-968f-ec564f489395
      POWER_PLATFORM_SOURCE_ENVIRONMENT_ID: 2fa12587-ea8f-ee93-ac2f-054f6b7fe2bb
      POWER_PLATFORM_SOLUTION_NAME: StaffMasterAutomation
      POWER_PLATFORM_APP_ID: 0e5f5c05-b67d-4a27-af71-ebe5e5381221
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Power Platform CLI
        shell: bash
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Authenticate to baseline environment with GitHub OIDC
        shell: bash
        run: |
          pac auth create \
            --name source-oidc \
            --githubFederated \
            --tenant "$POWER_PLATFORM_TENANT_ID" \
            --applicationId "$POWER_PLATFORM_CLIENT_ID" \
            --environment "$POWER_PLATFORM_SOURCE_ENVIRONMENT_ID"
          pac auth select --name source-oidc
          pac org who

      - name: Export baseline artifacts without changing the app
        shell: bash
        run: |
          mkdir -p artifacts/baseline
          pac solution export \
            --name "$POWER_PLATFORM_SOLUTION_NAME" \
            --path artifacts/baseline/StaffMasterAutomation.zip \
            --managed false \
            --overwrite \
            --environment "$POWER_PLATFORM_SOURCE_ENVIRONMENT_ID"
          pac canvas download \
            --name "$POWER_PLATFORM_APP_ID" \
            --file-name artifacts/baseline/StaffMaster_v1_11.msapp \
            --overwrite \
            --environment "$POWER_PLATFORM_SOURCE_ENVIRONMENT_ID"
          sha256sum \
            artifacts/baseline/StaffMasterAutomation.zip \
            artifacts/baseline/StaffMaster_v1_11.msapp \
            | tee artifacts/baseline/SHA256SUMS.txt

      - name: Unpack baseline Solution and canvas source
        shell: bash
        run: |
          pac solution unpack \
            --zipfile artifacts/baseline/StaffMasterAutomation.zip \
            --folder artifacts/baseline/solution-src \
            --packagetype Unmanaged
          solution_msapp="$(find artifacts/baseline/solution-src -type f -name '*.msapp' -print -quit)"
          test -n "$solution_msapp"
          sha256sum "$solution_msapp" | tee artifacts/baseline/SOLUTION_MSAPP_SHA256.txt
          pac canvas unpack \
            --msapp "$solution_msapp" \
            --sources artifacts/baseline/canvas-src
          find artifacts/baseline/canvas-src -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > artifacts/baseline/CANVAS_SOURCE_SHA256SUMS.txt

      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-5-baseline-export
          path: artifacts/baseline
          retention-days: 14
          if-no-files-found: error
