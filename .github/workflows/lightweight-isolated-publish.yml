name: Lightweight isolated publish authorization test
'on':
  push:
    branches: [feat/lightweight-v127-20260924]
    paths: [.github/workflows/lightweight-isolated-publish.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: staff-master-isolated-environment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: powerapps-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 2.12.2
      - uses: azure/login@v2
        with:
          client-id: 1c94f011-c447-4af1-968f-ec564f489395
          tenant-id: a00c92fa-e1db-4aa6-ab28-356c3203353d
          allow-no-subscriptions: true
      - name: Verify the isolated app and exact approved baseline without mutation
        run: python -u scripts/automation/lightweight_isolated_probe.py
      - name: Attempt isolated app-only publish as deployment identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.request
          import urllib.error
          from pathlib import Path

          app = 'bd256de5-c7a5-4487-9aef-91ee26d4c946'
          env = '68e00049-b7e5-eda6-9888-9a3cc493c5be'
          out = Path('artifacts/lightweight-isolated-publish')
          out.mkdir(parents=True, exist_ok=True)
          result = {'operation': 'isolated_publish_authorization', 'app_id': app,
                    'status': 'blocked', 'touched': False}
          try:
              probe = json.loads(Path('artifacts/lightweight-isolated-probe/result.json').read_text())
              if (probe.get('status') != 'pass' or probe.get('app_id') != app
                      or probe.get('components') != [['300', 'cra05_deployprobe20260924_b51e3']]
                      or probe.get('app_sha256') != '56265a17ba27503b46a65a4bf0d1803b48e3d743b3f9bb881fbab51ae2dd3e06'
                      or probe.get('source_match_stable') is not True
                      or probe.get('runtime_match_stable') is not True
                      or probe.get('runtime_control_count') != 244
                      or probe.get('sources') != ['M_職員基本', 'T_基準給与簿', 'T_通勤']):
                  result['reason'] = 'baseline or isolated scope drift'
                  raise SystemExit(2)
              result['preflight'] = 'exact_approved_baseline'
              token = subprocess.check_output(
                  ['az', 'account', 'get-access-token', '--resource', 'https://service.powerapps.com/',
                   '--query', 'accessToken', '--output', 'tsv'], text=True).strip()
              url = (f'https://api.powerapps.com/providers/Microsoft.PowerApps/apps/{app}/publish'
                     f"?api-version=2018-10-01&%24filter=environment%20eq%20%27{env}%27")
              request = urllib.request.Request(url, data=b'{}', method='POST',
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      result['http_status'] = response.status
                  result['status'] = 'publish_request_accepted'
                  result['touched'] = True
              except urllib.error.HTTPError as error:
                  result['http_status'] = error.code
                  result['reason'] = 'publish endpoint rejected deployment identity'
                  raise SystemExit(3)
          finally:
              (out / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
              print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Preserve narrowly scoped result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-isolated-publish-${{ github.run_id }}
          path: |
            artifacts/lightweight-isolated-probe/result.json
            artifacts/lightweight-isolated-publish/result.json
          retention-days: 14
